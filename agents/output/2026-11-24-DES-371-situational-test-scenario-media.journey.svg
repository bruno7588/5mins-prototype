<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1010" width="1120" height="1010" role="img" aria-label="Admin and learner journeys for scenario media on situational tests, from attaching media in the builder to revisiting it from every question" font-family="Poppins, Helvetica, Arial, sans-serif">
<defs><marker id="a" orient="auto" markerWidth="7" markerHeight="7" refX="5" refY="3.5"><path d="M0 0 L7 3.5 L0 7 Z" fill="#656B7C"/></marker></defs>
<rect width="1120" height="1010" fill="#F9F9FA"/>
<text x="16" y="34" font-size="20" fill="#20222A" font-weight="700" font-style="normal">Scenario media for situational tests (DES-371)</text>
<text x="16" y="56" font-size="12" fill="#454C5E" font-weight="400" font-style="normal">Job: When I'm answering questions about a workplace scenario, I want to watch, view or listen to it again whenever I need a detail, so I can</text>
<text x="16" y="73" font-size="12" fill="#454C5E" font-weight="400" font-style="normal">answer on what happened rather than what I remember, without losing my place or my answer.</text>
<text x="16" y="112" font-size="14" fill="#20222A" font-weight="700" font-style="normal">Admin: add scenario media in the builder (web)</text>
<rect x="16" y="124" width="248" height="150" rx="12" fill="#FFFFFF" stroke="#DFE1E6" stroke-width="1"/>
<text x="30" y="146" font-size="10" fill="#454C5E" font-weight="700" font-style="normal">1 TRIGGER</text>
<text x="30" y="164" font-size="12.5" fill="#20222A" font-weight="700" font-style="normal">Off-platform</text>
<text x="30" y="182" font-size="12" fill="#20222A" font-weight="400" font-style="normal">Has an acted clip of the scenario,</text>
<text x="30" y="198" font-size="12" fill="#20222A" font-weight="400" font-style="normal">or an image or audio.</text>
<text x="30" y="218" font-size="12" fill="#454C5E" font-weight="400" font-style="italic">&quot;Where does this clip go?&quot;</text>
<line x1="267" y1="199" x2="292" y2="199" stroke="#656B7C" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="296" y="124" width="248" height="150" rx="12" fill="#FFFFFF" stroke="#DFE1E6" stroke-width="1"/>
<text x="310" y="146" font-size="10" fill="#454C5E" font-weight="700" font-style="normal">2 ORIENT</text>
<text x="310" y="164" font-size="12.5" fill="#20222A" font-weight="700" font-style="normal">Drawer, Brief</text>
<text x="310" y="182" font-size="12" fill="#20222A" font-weight="400" font-style="normal">Sees &quot;Scenario media (optional)&quot;</text>
<text x="310" y="198" font-size="12" fill="#20222A" font-weight="400" font-style="normal">under the brief.</text>
<text x="310" y="218" font-size="12" fill="#454C5E" font-weight="400" font-style="italic">&quot;Is this for the scenario or a</text>
<text x="310" y="234" font-size="12" fill="#454C5E" font-weight="400" font-style="italic">question?&quot;</text>
<line x1="547" y1="199" x2="572" y2="199" stroke="#656B7C" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="576" y="124" width="248" height="150" rx="12" fill="#FFFFFF" stroke="#DFE1E6" stroke-width="1"/>
<text x="590" y="146" font-size="10" fill="#454C5E" font-weight="700" font-style="normal">3 ACT</text>
<text x="590" y="164" font-size="12.5" fill="#20222A" font-weight="700" font-style="normal">Scenario media field</text>
<text x="590" y="182" font-size="12" fill="#20222A" font-weight="400" font-style="normal">Drops in a video, audio or image</text>
<text x="590" y="198" font-size="12" fill="#20222A" font-weight="400" font-style="normal">file; it uploads while they keep</text>
<text x="590" y="214" font-size="12" fill="#20222A" font-weight="400" font-style="normal">writing.</text>
<text x="590" y="234" font-size="12" fill="#454C5E" font-weight="400" font-style="italic">&quot;Can I carry on?&quot;</text>
<line x1="827" y1="199" x2="852" y2="199" stroke="#656B7C" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="856" y="124" width="248" height="150" rx="12" fill="#FFFFFF" stroke="#DFE1E6" stroke-width="1"/>
<text x="870" y="146" font-size="10" fill="#454C5E" font-weight="700" font-style="normal">4 CONFIRM</text>
<text x="870" y="164" font-size="12.5" fill="#20222A" font-weight="700" font-style="normal">Scenario media field</text>
<text x="870" y="182" font-size="12" fill="#20222A" font-weight="400" font-style="normal">The preview appears in place; plays</text>
<text x="870" y="198" font-size="12" fill="#20222A" font-weight="400" font-style="normal">it to check.</text>
<text x="870" y="218" font-size="12" fill="#454C5E" font-weight="400" font-style="italic">&quot;Is this the right clip, and does it</text>
<text x="870" y="234" font-size="12" fill="#454C5E" font-weight="400" font-style="italic">play?&quot;</text>
<polyline points="980,276 980,294 140,294 140,310" fill="none" stroke="#656B7C" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="16" y="314" width="248" height="150" rx="12" fill="#FFFFFF" stroke="#DFE1E6" stroke-width="1"/>
<text x="30" y="336" font-size="10" fill="#454C5E" font-weight="700" font-style="normal">5 DECIDE</text>
<text x="30" y="354" font-size="12.5" fill="#20222A" font-weight="700" font-style="normal">Scenario media field</text>
<text x="30" y="372" font-size="12" fill="#20222A" font-weight="400" font-style="normal">Keeps it, or picks Change File or</text>
<text x="30" y="388" font-size="12" fill="#20222A" font-weight="400" font-style="normal">Remove.</text>
<text x="30" y="408" font-size="12" fill="#454C5E" font-weight="400" font-style="italic">&quot;Can I swap it without losing my</text>
<text x="30" y="424" font-size="12" fill="#454C5E" font-weight="400" font-style="italic">brief?&quot;</text>
<line x1="267" y1="389" x2="292" y2="389" stroke="#656B7C" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="296" y="314" width="248" height="150" rx="12" fill="#FFFFFF" stroke="#DFE1E6" stroke-width="1"/>
<text x="310" y="336" font-size="10" fill="#454C5E" font-weight="700" font-style="normal">6 ACT</text>
<text x="310" y="354" font-size="12.5" fill="#20222A" font-weight="700" font-style="normal">Drawer footer</text>
<text x="310" y="372" font-size="12" fill="#20222A" font-weight="400" font-style="normal">Saves the situational test.</text>
<text x="310" y="392" font-size="12" fill="#454C5E" font-weight="400" font-style="italic">&quot;Is it saved with the test?&quot;</text>
<line x1="547" y1="389" x2="572" y2="389" stroke="#656B7C" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="576" y="314" width="248" height="150" rx="12" fill="#FFFFFF" stroke="#008393" stroke-width="2"/>
<text x="590" y="336" font-size="10" fill="#454C5E" font-weight="700" font-style="normal">7 CONFIRM</text>
<text x="590" y="354" font-size="12.5" fill="#20222A" font-weight="700" font-style="normal">Preview</text>
<text x="590" y="372" font-size="12" fill="#20222A" font-weight="400" font-style="normal">Sees the brief card with the media,</text>
<text x="590" y="388" font-size="12" fill="#20222A" font-weight="400" font-style="normal">then the questions with View Brief.</text>
<text x="590" y="408" font-size="12" fill="#454C5E" font-weight="400" font-style="italic">&quot;What will learners see?&quot;</text>
<rect x="856" y="314" width="248" height="150" rx="12" fill="#FFFFFF" stroke="#9EA4B3" stroke-dasharray="5 4"/>
<text x="870" y="336" font-size="10" fill="#454C5E" font-weight="700" font-style="normal">SIDE PATHS</text>
<text x="870" y="354" font-size="12" fill="#20222A" font-weight="400" font-style="normal">Step 3, upload problem: unsupported,</text>
<text x="870" y="370" font-size="12" fill="#20222A" font-weight="400" font-style="normal">too large or failed; the field shows</text>
<text x="870" y="386" font-size="12" fill="#20222A" font-weight="400" font-style="normal">why, pick another file.</text>
<text x="870" y="406" font-size="12" fill="#20222A" font-weight="400" font-style="normal">Step 5, Remove: the empty field</text>
<text x="870" y="422" font-size="12" fill="#20222A" font-weight="400" font-style="normal">comes back; nothing is lost until</text>
<text x="870" y="438" font-size="12" fill="#20222A" font-weight="400" font-style="normal">Save.</text>
<text x="16" y="532" font-size="14" fill="#20222A" font-weight="700" font-style="normal">Learner: take the test in the course feed (web and mobile)</text>
<rect x="16" y="544" width="248" height="150" rx="12" fill="#FFFFFF" stroke="#DFE1E6" stroke-width="1"/>
<text x="30" y="566" font-size="10" fill="#454C5E" font-weight="700" font-style="normal">1 TRIGGER</text>
<text x="30" y="584" font-size="12.5" fill="#20222A" font-weight="700" font-style="normal">Course feed</text>
<text x="30" y="602" font-size="12" fill="#20222A" font-weight="400" font-style="normal">Opens the situational test from</text>
<text x="30" y="618" font-size="12" fill="#20222A" font-weight="400" font-style="normal">course details, first attempt or</text>
<text x="30" y="634" font-size="12" fill="#20222A" font-weight="400" font-style="normal">retake.</text>
<text x="30" y="654" font-size="12" fill="#454C5E" font-weight="400" font-style="italic">&quot;What is this test about?&quot;</text>
<line x1="267" y1="619" x2="292" y2="619" stroke="#656B7C" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="296" y="544" width="248" height="150" rx="12" fill="#FFFFFF" stroke="#DFE1E6" stroke-width="1"/>
<text x="310" y="566" font-size="10" fill="#454C5E" font-weight="700" font-style="normal">2 ORIENT</text>
<text x="310" y="584" font-size="12.5" fill="#20222A" font-weight="700" font-style="normal">Brief card</text>
<text x="310" y="602" font-size="12" fill="#20222A" font-weight="400" font-style="normal">Sees the media (stopped), the brief,</text>
<text x="310" y="618" font-size="12" fill="#20222A" font-weight="400" font-style="normal">Start, and that they can come back.</text>
<text x="310" y="638" font-size="12" fill="#454C5E" font-weight="400" font-style="italic">&quot;Do I have to watch this first?&quot;</text>
<line x1="547" y1="619" x2="572" y2="619" stroke="#656B7C" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="576" y="544" width="248" height="150" rx="12" fill="#FFFFFF" stroke="#DFE1E6" stroke-width="1"/>
<text x="590" y="566" font-size="10" fill="#454C5E" font-weight="700" font-style="normal">3 ACT</text>
<text x="590" y="584" font-size="12.5" fill="#20222A" font-weight="700" font-style="normal">Brief card</text>
<text x="590" y="602" font-size="12" fill="#20222A" font-weight="400" font-style="normal">Plays the video and goes full</text>
<text x="590" y="618" font-size="12" fill="#20222A" font-weight="400" font-style="normal">screen, listens to the audio, or</text>
<text x="590" y="634" font-size="12" fill="#20222A" font-weight="400" font-style="normal">opens the image.</text>
<text x="590" y="654" font-size="12" fill="#454C5E" font-weight="400" font-style="italic">&quot;Can I see it bigger?&quot;</text>
<line x1="827" y1="619" x2="852" y2="619" stroke="#656B7C" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="856" y="544" width="248" height="150" rx="12" fill="#FFFFFF" stroke="#DFE1E6" stroke-width="1"/>
<text x="870" y="566" font-size="10" fill="#454C5E" font-weight="700" font-style="normal">4 DECIDE</text>
<text x="870" y="584" font-size="12.5" fill="#20222A" font-weight="700" font-style="normal">Brief card</text>
<text x="870" y="602" font-size="12" fill="#20222A" font-weight="400" font-style="normal">Taps Start Situational Test, which</text>
<text x="870" y="618" font-size="12" fill="#20222A" font-weight="400" font-style="normal">is always enabled.</text>
<text x="870" y="638" font-size="12" fill="#454C5E" font-weight="400" font-style="italic">&quot;Have I got enough to answer?&quot;</text>
<polyline points="980,696 980,714 140,714 140,730" fill="none" stroke="#656B7C" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="16" y="734" width="248" height="150" rx="12" fill="#FFFFFF" stroke="#DFE1E6" stroke-width="1"/>
<text x="30" y="756" font-size="10" fill="#454C5E" font-weight="700" font-style="normal">5 ACT</text>
<text x="30" y="774" font-size="12.5" fill="#20222A" font-weight="700" font-style="normal">Question screen</text>
<text x="30" y="792" font-size="12" fill="#20222A" font-weight="400" font-style="normal">Reads the question and picks an</text>
<text x="30" y="808" font-size="12" fill="#20222A" font-weight="400" font-style="normal">answer.</text>
<text x="30" y="828" font-size="12" fill="#454C5E" font-weight="400" font-style="italic">&quot;What exactly did the guest say?&quot;</text>
<line x1="267" y1="809" x2="292" y2="809" stroke="#656B7C" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="296" y="734" width="248" height="150" rx="12" fill="#FFFFFF" stroke="#DFE1E6" stroke-width="1"/>
<text x="310" y="756" font-size="10" fill="#454C5E" font-weight="700" font-style="normal">6 ACT</text>
<text x="310" y="774" font-size="12.5" fill="#20222A" font-weight="700" font-style="normal">Details panel or sheet</text>
<text x="310" y="792" font-size="12" fill="#20222A" font-weight="400" font-style="normal">Web: the brief and media sit beside</text>
<text x="310" y="808" font-size="12" fill="#20222A" font-weight="400" font-style="normal">the question. Mobile: taps View</text>
<text x="310" y="824" font-size="12" fill="#20222A" font-weight="400" font-style="normal">Brief.</text>
<text x="310" y="844" font-size="12" fill="#454C5E" font-weight="400" font-style="italic">&quot;Will I lose my answer if I check?&quot;</text>
<line x1="547" y1="809" x2="572" y2="809" stroke="#656B7C" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="576" y="734" width="248" height="150" rx="12" fill="#FFFFFF" stroke="#DFE1E6" stroke-width="1"/>
<text x="590" y="756" font-size="10" fill="#454C5E" font-weight="700" font-style="normal">7 ORIENT</text>
<text x="590" y="774" font-size="12.5" fill="#20222A" font-weight="700" font-style="normal">Question screen</text>
<text x="590" y="792" font-size="12" fill="#20222A" font-weight="400" font-style="normal">Back on the question; the answer and</text>
<text x="590" y="808" font-size="12" fill="#20222A" font-weight="400" font-style="normal">place are kept.</text>
<text x="590" y="828" font-size="12" fill="#454C5E" font-weight="400" font-style="italic">&quot;Where was I?&quot;</text>
<line x1="827" y1="809" x2="852" y2="809" stroke="#656B7C" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="856" y="734" width="248" height="150" rx="12" fill="#FFFFFF" stroke="#008393" stroke-width="2"/>
<text x="870" y="756" font-size="10" fill="#454C5E" font-weight="700" font-style="normal">8 CONFIRM</text>
<text x="870" y="774" font-size="12.5" fill="#20222A" font-weight="700" font-style="normal">Result</text>
<text x="870" y="792" font-size="12" fill="#20222A" font-weight="400" font-style="normal">Checks each answer and continues;</text>
<text x="870" y="808" font-size="12" fill="#20222A" font-weight="400" font-style="normal">the course feed shows the result.</text>
<text x="870" y="828" font-size="12" fill="#454C5E" font-weight="400" font-style="italic">&quot;How did I do?&quot;</text>
<rect x="16" y="892" width="1088" height="78" rx="12" fill="#FFFFFF" stroke="#9EA4B3" stroke-dasharray="5 4"/>
<text x="30" y="912" font-size="10" fill="#454C5E" font-weight="700" font-style="normal">SIDE PATHS</text>
<text x="30" y="929" font-size="12" fill="#20222A" font-weight="400" font-style="normal">Step 3, playback problem: loading, failed or can't play on this device; a message that points to the brief, with Try Again.</text>
<text x="30" y="945" font-size="12" fill="#20222A" font-weight="400" font-style="normal">The brief and Start still work.</text>
<text x="30" y="961" font-size="12" fill="#20222A" font-weight="400" font-style="normal">Steps 5 to 7 repeat on every question.</text>
<text x="16" y="992" font-size="12" fill="#454C5E" font-weight="400" font-style="normal">V1 rules: one media item per test, on the brief; video never autoplays; Start is always enabled; retakes show the brief again.</text>
</svg>