<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 770" width="1160" height="770" role="img" aria-label="User journey for Saved: a learner remembers something they saved, opens the gear menu, picks Saved, lands on Bookmarks, switches tab and scans the cards, opens a card, and returns to the same tab with Back. Side paths: looking for Profile out of habit, an old profile link, and an empty tab." font-family="Poppins, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="jarrow" orient="auto" markerWidth="8" markerHeight="8" refX="7" refY="4">
      <path d="M0 0 L8 4 L0 8 Z" fill="#454C5E"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1160" height="770" fill="#F9F9FA"/>

  <text x="36" y="48" font-size="20" font-weight="700" fill="#20222A">Saved - how a learner gets back to something they saved</text>
  <text x="36" y="76" font-size="12" fill="#454C5E">When a learner wants to get back to a lesson, course or instructor they saved, they want to find it in one predictable place</text>
  <text x="36" y="94" font-size="12" fill="#454C5E">so they can pick up where they left off without it taking a slot in the main navigation.</text>

  <!-- connectors, row 1 -->
  <g stroke="#454C5E" stroke-width="2" fill="none">
    <line x1="284" y1="215" x2="314" y2="215" marker-end="url(#jarrow)"/>
    <line x1="564" y1="215" x2="594" y2="215" marker-end="url(#jarrow)"/>
    <line x1="844" y1="215" x2="874" y2="215" marker-end="url(#jarrow)"/>
    <polyline points="1000,310 1000,335 160,335 160,358" marker-end="url(#jarrow)"/>
    <line x1="284" y1="455" x2="314" y2="455" marker-end="url(#jarrow)"/>
    <line x1="564" y1="455" x2="594" y2="455" marker-end="url(#jarrow)"/>
  </g>

  <!-- row 1 cards -->
  <g>
    <rect x="36" y="120" width="248" height="190" rx="12" fill="#FFFFFF" stroke="#DFE1E6"/>
    <rect x="52" y="134" width="92" height="22" rx="11" fill="#D6F7FB"/>
    <text x="98" y="149" font-size="12" font-weight="500" fill="#20222A" text-anchor="middle">1 · Trigger</text>
    <text font-size="12" fill="#454C5E"><tspan x="52" y="180">Any learner page (web),</tspan><tspan x="52" y="196">any tab (mobile)</tspan></text>
    <text font-size="14" font-weight="600" fill="#20222A"><tspan x="52" y="236">Remembers something they</tspan><tspan x="52" y="255">saved and wants it back</tspan></text>
    <text x="52" y="294" font-size="12" font-style="italic" fill="#454C5E">“Where did I put that?”</text>
  </g>
  <g>
    <rect x="316" y="120" width="248" height="190" rx="12" fill="#FFFFFF" stroke="#DFE1E6"/>
    <rect x="332" y="134" width="88" height="22" rx="11" fill="#D6F7FB"/>
    <text x="376" y="149" font-size="12" font-weight="500" fill="#20222A" text-anchor="middle">2 · Orient</text>
    <text font-size="12" fill="#454C5E"><tspan x="332" y="180">Sidebar profile card (web), More</tspan><tspan x="332" y="196">(narrow web), Settings tab</tspan><tspan x="332" y="212">(mobile)</tspan></text>
    <text font-size="14" font-weight="600" fill="#20222A"><tspan x="332" y="236">Opens the gear menu</tspan></text>
    <text x="332" y="294" font-size="12" font-style="italic" fill="#454C5E">“Is my saved stuff in here?”</text>
  </g>
  <g>
    <rect x="596" y="120" width="248" height="190" rx="12" fill="#FFFFFF" stroke="#DFE1E6"/>
    <rect x="612" y="134" width="88" height="22" rx="11" fill="#D6F7FB"/>
    <text x="656" y="149" font-size="12" font-weight="500" fill="#20222A" text-anchor="middle">3 · Decide</text>
    <text font-size="12" fill="#454C5E"><tspan x="612" y="180">Gear menu</tspan></text>
    <text font-size="14" font-weight="600" fill="#20222A"><tspan x="612" y="236">Picks Saved, next to</tspan><tspan x="612" y="255">Edit Profile and Log Out</tspan><tspan x="612" y="274">(plus Dark Mode on web)</tspan></text>
    <text x="612" y="294" font-size="12" font-style="italic" fill="#454C5E">“Is this where my bookmarks went?”</text>
  </g>
  <g>
    <rect x="876" y="120" width="248" height="190" rx="12" fill="#FFFFFF" stroke="#DFE1E6"/>
    <rect x="892" y="134" width="88" height="22" rx="11" fill="#D6F7FB"/>
    <text x="936" y="149" font-size="12" font-weight="500" fill="#20222A" text-anchor="middle">4 · Orient</text>
    <text font-size="12" fill="#454C5E"><tspan x="892" y="180">Saved page (web)</tspan><tspan x="892" y="196">or screen (mobile)</tspan></text>
    <text font-size="14" font-weight="600" fill="#20222A"><tspan x="892" y="236">Lands on Bookmarks, with</tspan><tspan x="892" y="255">Likes and Following alongside</tspan></text>
    <text x="892" y="294" font-size="12" font-style="italic" fill="#454C5E">“Which list is it in?”</text>
  </g>

  <!-- row 2 cards -->
  <g>
    <rect x="36" y="360" width="248" height="190" rx="12" fill="#FFFFFF" stroke="#DFE1E6"/>
    <rect x="52" y="374" width="88" height="22" rx="11" fill="#D6F7FB"/>
    <text x="96" y="389" font-size="12" font-weight="500" fill="#20222A" text-anchor="middle">5 · Decide</text>
    <text font-size="12" fill="#454C5E"><tspan x="52" y="420">Saved, any tab</tspan></text>
    <text font-size="14" font-weight="600" fill="#20222A"><tspan x="52" y="476">Switches tab, or Lessons /</tspan><tspan x="52" y="495">Courses, and scans the cards</tspan></text>
    <text x="52" y="534" font-size="12" font-style="italic" fill="#454C5E">“Did I bookmark it or like it?”</text>
  </g>
  <g>
    <rect x="316" y="360" width="248" height="190" rx="12" fill="#FFFFFF" stroke="#DFE1E6"/>
    <rect x="332" y="374" width="68" height="22" rx="11" fill="#D6F7FB"/>
    <text x="366" y="389" font-size="12" font-weight="500" fill="#20222A" text-anchor="middle">6 · Act</text>
    <text font-size="12" fill="#454C5E"><tspan x="332" y="420">Lesson or course</tspan></text>
    <text font-size="14" font-weight="600" fill="#20222A"><tspan x="332" y="476">Opens the card</tspan></text>
    <text x="332" y="534" font-size="12" font-style="italic" fill="#454C5E">“Is this the one?”</text>
  </g>
  <g>
    <rect x="596" y="360" width="248" height="190" rx="12" fill="#FFFFFF" stroke="#DFE1E6"/>
    <rect x="612" y="374" width="96" height="22" rx="11" fill="#D9F1E4"/>
    <text x="660" y="389" font-size="12" font-weight="500" fill="#20222A" text-anchor="middle">7 · Confirm</text>
    <text font-size="12" fill="#454C5E"><tspan x="612" y="420">The item, then Saved</tspan></text>
    <text font-size="14" font-weight="600" fill="#20222A"><tspan x="612" y="476">The item opens; Back returns</tspan><tspan x="612" y="495">to Saved on the same tab</tspan></text>
    <text x="612" y="534" font-size="12" font-style="italic" fill="#454C5E">“Can I get back to my list?”</text>
  </g>

  <g>
    <rect x="876" y="360" width="248" height="190" rx="12" fill="#FFFFFF" stroke="#9EA4B3" stroke-dasharray="6 6"/>
    <rect x="892" y="374" width="150" height="22" rx="11" fill="#D6F7FB"/>
    <text x="967" y="389" font-size="12" font-weight="500" fill="#20222A" text-anchor="middle">0 · Before step 1</text>
    <text font-size="12" fill="#454C5E"><tspan x="892" y="420">Lesson feed (web and mobile)</tspan></text>
    <text font-size="14" font-weight="600" fill="#20222A"><tspan x="892" y="476">Bookmarks a lesson; a toast</tspan><tspan x="892" y="495">says “Find it in Saved”</tspan></text>
    <text x="892" y="534" font-size="12" font-style="italic" fill="#454C5E">“Where does this go?”</text>
  </g>

  <!-- side paths -->
  <text x="36" y="600" font-size="13" font-weight="700" fill="#20222A">Side paths</text>
  <g>
    <rect x="36" y="616" width="340" height="118" rx="12" fill="#FFFFFF" stroke="#9EA4B3" stroke-dasharray="6 6"/>
    <rect x="52" y="630" width="130" height="22" rx="11" fill="#FADCE3"/>
    <text x="117" y="645" font-size="12" font-weight="500" fill="#20222A" text-anchor="middle">Risk · from step 2</text>
    <text x="52" y="676" font-size="14" font-weight="600" fill="#20222A">Looks for Profile out of habit</text>
    <text font-size="12" fill="#454C5E"><tspan x="52" y="698">The sidebar item and mobile tab are gone;</tspan><tspan x="52" y="714">the bookmark toast is the only pointer.</tspan></text>
  </g>
  <g>
    <rect x="410" y="616" width="340" height="118" rx="12" fill="#FFFFFF" stroke="#9EA4B3" stroke-dasharray="6 6"/>
    <rect x="426" y="630" width="160" height="22" rx="11" fill="#FFF1E0"/>
    <text x="506" y="645" font-size="12" font-weight="500" fill="#20222A" text-anchor="middle">Replaces steps 2 and 3</text>
    <text x="426" y="676" font-size="14" font-weight="600" fill="#20222A">Old /profile link</text>
    <text font-size="12" fill="#454C5E"><tspan x="426" y="698">An old link lands on Saved, on the</tspan><tspan x="426" y="714">same tab if the link named one.</tspan></text>
  </g>
  <g>
    <rect x="784" y="616" width="340" height="118" rx="12" fill="#FFFFFF" stroke="#9EA4B3" stroke-dasharray="6 6"/>
    <rect x="800" y="630" width="124" height="22" rx="11" fill="#FFF1E0"/>
    <text x="862" y="645" font-size="12" font-weight="500" fill="#20222A" text-anchor="middle">From step 4 or 5</text>
    <text x="800" y="676" font-size="14" font-weight="600" fill="#20222A">Empty tab</text>
    <text font-size="12" fill="#454C5E"><tspan x="800" y="698">Names the control that fills it and offers</tspan><tspan x="800" y="714">one way to go and find something.</tspan></text>
  </g>
</svg>
